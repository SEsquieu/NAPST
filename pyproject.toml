[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napst"
version = "0.2.0"
description = "Black-box behavioral mapping for LLM and agentic systems"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Seth Esquieu"}]
dependencies = [
  "typer>=0.12.3",
  "httpx>=0.27.0",
  "playwright>=1.52.0",
  "pydantic>=2.7.1",
  "PyYAML>=6.0.1",
  "rich>=13.7.1",
  "jinja2>=3.1.4",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[project.scripts]
napst = "napst_cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
